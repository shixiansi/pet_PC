# 这个 workflow 只跑「不依赖外部仓库、不依赖真实桌面」的那部分门禁。
# 它不是 .dev/check-all.ps1 的替代品，而是它的一个子集：CI 的价值在于每次
# push 都跑一遍最便宜、最容易漂移的那几项，而不是复现那台开发机。
#
# 为什么是 Windows：产品只支持 Windows，而且 internal/desktop 下大量文件是
# _windows.go —— 在 Linux runner 上 vet 会去编译 _other.go 的桩，测的是另一
# 套代码，绿了也不说明问题。
#
# 这里刻意【没有】覆盖的东西，以及各自的原因：
#   - .dev/run-frontend-harness.cjs（真浏览器引擎行为）：需要真实浏览器引擎。
#   - market/tests/*.test.js（插件自己的 app.js）：那是插件仓自己的 CI 在跑
#     （npm test + plugin-check + check-catalogue），不在这里重复。
#
# 【曾经】也在这里的两条，2026-11-01 之后进了 contract job —— 它们只要检出第二个
# 仓库就能跑，而"没检出所以跳过"的代价是两个真问题：
#   - internal/plugins 的 sample 字节对比：没有 market/ 时它 SKIP，而 SKIP 的结果是
#     九个内置包与市场漂了整整一轮没人知道（那次修完才发现的）；
#   - .dev/check-frontend.cjs 的 138 条静态接线检查：它读 market/plugins/*。
#   - .dev/verify-*.ps1 四个像素门禁：需要真实交互桌面和 WebView2 控制器。
#   - wails build：需要 Wails CLI 与 WebView2，且这几分钟的构建在 PR 上的
#     收益不如把 go vet/test 稳定跑起来。
#
# Go 的两条命令按 module 分别跑，因为 tools/plugin-market 是独立 module：
# 根目录的 `go vet ./...` 不会下潜进去，漏掉它就等于市场程序没有测试。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支上新的 push 取消上一次还没跑完的，PR 上连推几次不会排队。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # go.mod 同时写了 `go 1.22.0` 和 `toolchain go1.22.12`；setup-go 从文件里
      # 读版本，省得这里和 go.mod 各写一个数字、然后其中一个过期。
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt 列出未格式化的文件时退出码仍然是 0，所以判定必须看输出，不能看
      # $LASTEXITCODE —— 这里把"有输出"当成失败。
      #
      # `gofmt -l .` 在新检出里只会看到被跟踪的 Go 文件：.dev/、market/、scratch/、
      # pet_pc/ 都在 .gitignore 里，CI 中并不存在。所以不需要排除名单。
      - name: gofmt
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            $unformatted | ForEach-Object { Write-Host "unformatted: $_" }
            throw "gofmt would reformat the files above"
          }

      - name: go vet
        run: go vet ./...

      # 集成测试里有一批要访问 HKCU 的开机自启注册表项。托管 runner 上它是可写的，
      # 所以这些用例在这里会真的跑起来（开发机上的沙箱不允许，那些用例会以
      # "open Run key: Access is denied" 失败——那是环境限制，不是代码问题）。
      - name: go test
        run: go test ./... -count=1

      # tools/plugin-market 是独立 module：上面两条命令看不到它。
      - name: plugin market go vet
        working-directory: tools/plugin-market
        run: go vet ./...

      - name: plugin market go test
        working-directory: tools/plugin-market
        run: go test ./... -count=1

  frontend:
    name: Frontends (build + vitest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 桌宠前端：lockfile 已提交，所以用 `npm ci` —— 它按 lock 装、装的是
      # 上一次验证过的那套版本，而不是今天解析出来的另一套。
      - name: install (pet frontend)
        working-directory: frontend
        run: npm ci

      - name: build (pet frontend)
        working-directory: frontend
        run: npm run build

      - name: test (pet frontend)
        working-directory: frontend
        run: npm test

      # 市场前端：lockfile 也已提交（这次一并补上——在此之前这个目录只有
      # package.json，靠 ^22.1.0 / ^0.34.6 的浮动范围解析，两台机器能装到
      # 不同版本）。两个前端现在都是 `npm ci`，装的是验证过的那一套。
      - name: install (market frontend)
        working-directory: tools/plugin-market/frontend
        run: npm ci

      - name: build (market frontend)
        working-directory: tools/plugin-market/frontend
        run: npm run build

      - name: test (market frontend)
        working-directory: tools/plugin-market/frontend
        run: npm test

  # 契约检查：需要**第二个**仓库，所以单独一个 job（检出两次比塞进 go job 更清楚）。
  contract:
    name: 契约 (sample 字节 + 静态接线)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 插件仓是**公开**仓库，所以不需要任何 secret。检出到 market/ 之后，上面头部注释
      # 里说的那两条才真的在 CI 里跑；`go test` 找到 ../../market/dist，
      # check-frontend.cjs 找到 market/plugins 与 market/docs。
      - uses: actions/checkout@v4
        with:
          repository: shixiansi/pet-pc-plugins
          path: market

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 失败时它会逐个点名是哪个包、市场是哪个摘要、内置是哪个摘要（AGENTS §3.7）。
      - name: 内置 sample 与市场逐字节一致
        shell: pwsh
        run: go test ./internal/plugins/ -run 'TestBuiltinSample' -count=1 -v

      - name: 静态接线检查（138 条）
        run: node .dev/check-frontend.cjs