<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetPC</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <!-- Everything is positioned from the layout the Go side computes. -->
  <div id="stage">
    <div id="pet" title="拖动移动 · 单击打开待办">
      <img id="pet-image" alt="桌宠" draggable="false" />
      <!-- Two badges, stacked: the pomodoro countdown on top of the open-todo
           count. Both are inside the pet box so neither can draw outside the
           window region. -->
      <span id="timer-badge" class="badge timer hidden"></span>
      <span id="badge" class="badge hidden"></span>
    </div>

    <!-- Speech bubble: the todo reminder, the todo picker and the summary
         prompt all use this one card, because they all occupy the same slot
         beside the pet. Only one of {bubble, panel} is ever visible. -->
    <section id="bubble" class="bubble hidden" aria-live="polite">
      <div id="bubble-arrow" class="bubble-arrow"></div>
      <h2 id="bubble-title" class="bubble-title"></h2>
      <p id="bubble-todo" class="bubble-todo hidden"></p>
      <p id="bubble-plan" class="bubble-plan hidden"></p>
      <ul id="bubble-list" class="bubble-list hidden"></ul>
      <p id="bubble-more" class="bubble-more hidden"></p>
      <textarea id="bubble-input" class="bubble-input hidden" rows="3" placeholder="写点什么…（Enter 保存）" maxlength="2000"></textarea>
      <div id="bubble-actions" class="bubble-actions">
        <button id="bubble-secondary" type="button"></button>
        <button id="bubble-primary" type="button" class="primary"></button>
      </div>
    </section>

    <!-- Plugin floating surface: the mount point for a plugin's own window,
         placed at the rectangles Go computed for it.

         It is the THIRD occupant of the slot beside the pet (with the panel and
         the speech bubble), and only one of the three is ever visible. What it is
         NOT is a second window: Wails v2 has no multi-window API and the app finds
         its window by class name, so a plugin's interface has to live inside this
         one. The rectangles come from the layout - this element never derives a
         size of its own.

         The markup inside is built by src/plugin-host.js. -->
    <div id="plugin-surface" class="hidden"></div>

    <!-- The headless plugin frame: one plugin that declared `background` and was
         granted `events` runs here, permanently mounted and hidden.

         It exists because a plugin's events are delivered only to a frame the host
         has mounted, and some plugins must act while no interface is on screen - a
         voice plugin has to hear the pomodoro end whether or not the panel is open.
         Hidden rather than merely unpainted, so it can never be clicked or take
         layout space. See plugin-host.js's openBackground. -->
    <div id="plugin-background" class="hidden"></div>

    <section id="panel" class="hidden" aria-label="待办与日程">
      <header class="panel-head">
        <div class="tabs">
          <button class="tab active" data-tab="todos">待办</button>
          <!-- The 对话 tab exists only while a plugin fills it. It is hidden
               (not merely disabled) when none does, because a tab that opens onto
               an explanation of why it is empty is worse than no tab: the pet has
               no conversation of its own any more, so there is nothing for the
               user to do there. main.js owns the visibility; the markup always
               contains the button so the data-tab values stay stable. -->
          <button class="tab" id="tab-chat-btn" data-tab="chat">对话</button>
          <!-- 「记录」 and 「设置」 are gone, and this is where the panel stops being the
               place for either.

               记录 folded into the 待办 tab as a collapsed archive (see #records-fold
               below): the same list, one click away, and the panel stops having a tab that
               opens onto "nothing yet".

               设置 moved to the control center (PetPCPluginMarket.exe) - the window that
               can hold five groups of controls. What could not move went to the places that
               own it: 放弃 next to 停止/跳过 in the pomodoro strip, and the program-level
               actions (打开控制中心 / 退出 / 立刻提醒 / 打开数据目录) to the tray menu. Nothing
               is left reachable only from a tab that no longer exists. -->
        </div>
        <button id="close-panel" class="icon-btn" title="收起面板">×</button>
      </header>

      <!-- Conversation view: a MOUNT POINT, not controls.
           Since the chat plugin renders the conversation, this tab body holds
           nothing but #chat-slot. The host resolves which installed plugin owns
           the slot and mounts its sandboxed iframe here; with none installed the
           slot shows an explanation instead of an empty frame (see main.js).
           One id is all that is left on purpose: the controls that used to live
           here are the plugin's own business now, and a second copy of them in
           the host is the thing this change removed. -->
      <div id="tab-chat" class="tab-body hidden">
        <div id="chat-slot" class="chat-slot"></div>
      </div>

      <!-- Todo view -->
      <div id="tab-todos" class="tab-body">
        <!-- Pomodoro strip: the timer's controls and countdown. -->
        <div id="pomo-strip" class="pomo-strip">
          <div class="pomo-line">
            <span id="pomo-phase" class="pomo-phase">番茄钟未开启</span>
            <span id="pomo-countdown" class="pomo-countdown"></span>
          </div>
          <p id="pomo-todo" class="pomo-todo hidden"></p>
          <div class="pomo-actions">
            <button id="pomo-toggle" type="button" class="link-btn">开启番茄钟</button>
            <button id="pomo-start" type="button" class="primary hidden">开始专注</button>
            <button id="pomo-pause" type="button" class="hidden">暂停</button>
            <button id="pomo-resume" type="button" class="hidden">继续</button>
            <button id="pomo-stop" type="button" class="hidden">停止</button>
            <button id="pomo-skip" type="button" class="hidden">跳过</button>
            <!-- 「放弃」lives here rather than with the other settings: it is an action on
                 the session that is running right now, and it needs the confirmation dialog
                 this page already owns. It used to sit in the settings tab, which is being
                 retired (openspec/changes/ui-rebuild 阶段 3) - and of everything that tab
                 held, this is the one control that could not simply move to the control
                 center, because there the pet may not even be running. -->
            <button id="pomo-reset" type="button" class="link-btn danger hidden">放弃</button>
          </div>
        </div>

        <form id="todo-form" class="todo-form">
          <input id="todo-title" type="text" placeholder="添加一件事…" autocomplete="off" maxlength="200" />
          <div class="form-row">
            <input id="todo-due" type="datetime-local" title="截止时间（可选）" />
            <button type="submit" class="primary">添加</button>
          </div>
          <textarea id="todo-notes" rows="2" placeholder="备注（可选）" maxlength="2000"></textarea>
        </form>

        <div class="list-head">
          <span id="summary" class="summary"></span>
          <button id="clear-done" class="link-btn">清除已完成</button>
        </div>

        <ul id="todo-list" class="todo-list"></ul>
        <p id="empty-hint" class="empty">还没有待办，上面添加一条吧。</p>

        <!-- The finished-session archive used to be its own tab («记录»). It is here now,
             folded shut, for two reasons. The panel has room for one job («今天要做什么»),
             and the archive is something you open occasionally rather than watch. Nothing
             about the rendering changed: the three ids below are the same ones main.js has
             always painted into, so the folding, the day grouping and the inline editing of
             a record's summary all still run through the same code.

             A <details> rather than a fourth tab, because a tab that opens onto "nothing to
             see yet" reads as a broken feature, whereas a closed summary reads as "there is
             an archive here, open it if you want". -->
        <details id="records-fold" class="records-fold">
          <summary>番茄记录</summary>
          <p id="records-empty" class="empty">还没有记录。完成一个番茄后会自动记录在这里。</p>
          <ul id="records-list" class="record-list"></ul>
          <p id="records-total" class="record-total"></p>
        </details>
      </div>

      <p id="toast" class="toast hidden"></p>

      <!-- Confirmation dialog. It is drawn INSIDE the panel rather than with
           window.confirm(), because a native dialog is rendered by WebView2 as a
           separate browser-chrome window: it ignores the app's styling, covers
           the panel, and sits outside the region the window is cropped to, so it
           looks nothing like the rest of the pet.

           The outer element is a dimming scrim over the whole panel and the
           inner one is the card, so the dialog reads as clearly separate from
           the panel content behind it. -->
      <div id="confirm" class="confirm hidden" role="dialog" aria-modal="true">
        <div class="confirm-card">
          <p id="confirm-text" class="confirm-text"></p>
          <div class="confirm-actions">
            <button id="confirm-cancel" type="button">取消</button>
            <button id="confirm-ok" type="button" class="danger">确定</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  
</body>
</html>
