<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetPC</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <!-- Everything is positioned from the layout the Go side computes. -->
  <div id="stage">
    <!-- The pet. It is the whole product: everything else and anything the pet has to say
         hangs off its box. -->
    <div id="pet" title="拖动移动 · 单击打开对话 · 悬停出现对话按钮">
      <img id="pet-image" alt="桌宠" draggable="false" />
      <!-- The open-todo count, inside the pet box so it cannot draw outside the window
           region. It counts what the TODO PLUGIN publishes (its `todo-list` snapshot),
           because the list is that plugin's data now. -->
      <span id="badge" class="badge hidden"></span>

      <!-- The conversation entry: painted by hover, opened by a click (the gesture
           the double click used to be).

           It sits INSIDE #pet's box deliberately. While no panel or bubble is up
           the window is cropped to exactly the pet's rectangle, so anything hanging
           off the pet's edge would be cut away by the native region - and enlarging
           the region to fit it would leave a hole beside the pet that the page never
           paints and that eats clicks meant for the desktop. Inside the box the
           button needs no geometry from Go at all; see the .pet-chat rules in
           style.css and AGENTS.md 3.2. -->
      <button id="pet-chat" class="pet-chat" type="button" title="对话" aria-label="对话">
        <svg class="pet-chat-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 3h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7l-6 5v-5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
        </svg>
      </button>
    </div>

    <!-- Speech bubble: the reminder and the pet's own menu use this one card,
         because both occupy the same slot beside the pet. Only one of {bubble,
         panel, surface} is ever visible.

         Two kinds are left of the four this card used to draw. The picker, the
         summary prompt and the plan prompt all belonged to the host's timer and
         went with it; the pomodoro plugin asks its own questions in its own
         surface, so there is no host question left that needs a textarea or a
         list of todos inside this card. -->
    <section id="bubble" class="bubble hidden" aria-live="polite">
      <div id="bubble-arrow" class="bubble-arrow"></div>
      <h2 id="bubble-title" class="bubble-title"></h2>
      <ul id="bubble-list" class="bubble-list hidden"></ul>
      <p id="bubble-more" class="bubble-more hidden"></p>
      <!-- The pet's own menu: what a right-click on the pet opens, and the reason
           the pet no longer borrows the tray icon's menu.

           It lives INSIDE the bubble card rather than in a container of its own,
           because it is a bubble kind (BubbleMenu in app_pet_menu.go): the window
           is cropped to this card's rectangle, so a grid here costs no geometry
           and no new placeholder in the one-visible-thing-at-a-time slot. The
           cheat sheet "a new control has to answer which rectangle it lives in"
           is answered by this div's parent - see AGENTS.md 3.2.

           Three columns of three, one icon and one word per cell. The labels are
           the same words the tray menu uses where the two share an action, so a
           user who has met one menu recognises the other.

           The icons are inline SVG on purpose: the pet has no image assets beyond
           the picture, and a glyph font would put a dependency between the window
           and an installed font. Strokes are `currentColor`, so a cell's hover
           colour takes the icon with it. -->
      <div id="bubble-menu" class="bubble-menu hidden">
        <button type="button" class="menu-cell" data-menu="todos" title="待办与日程">
          <svg class="menu-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="4.5" width="18" height="16.5" rx="2.5" />
            <path d="M8 2.5v4M16 2.5v4M3 9.5h18" />
          </svg>
          <span class="menu-label">日程</span>
        </button>
        <button type="button" class="menu-cell" data-menu="chat" title="对话">
          <svg class="menu-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 3h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7l-6 5v-5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
          </svg>
          <span class="menu-label">对话</span>
        </button>
        <button type="button" class="menu-cell" data-menu="pomodoro" title="打开番茄钟">
          <svg class="menu-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="13.5" r="7.5" />
            <path d="M12 9.5v4l2.5 2M9 2.6h6" />
          </svg>
          <span class="menu-label">番茄钟</span>
        </button>
        <button type="button" class="menu-cell" data-menu="remind" title="立刻提醒一次">
          <svg class="menu-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6.5 9.5a5.5 5.5 0 0 1 11 0c0 4 1.5 5.5 1.5 5.5H5s1.5-1.5 1.5-5.5z" />
            <path d="M10 18.5a2 2 0 0 0 4 0" />
          </svg>
          <span class="menu-label">提醒</span>
        </button>
        <button type="button" class="menu-cell" data-menu="plugins" title="打开控制中心（插件管理）">
          <svg class="menu-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M10 4.5a2 2 0 0 1 4 0V6h3.5A1.5 1.5 0 0 1 19 7.5V11h1.5a2 2 0 0 1 0 4H19v3.5a1.5 1.5 0 0 1-1.5 1.5H14v-1.5a2 2 0 0 0-4 0V20H6.5A1.5 1.5 0 0 1 5 18.5V15H3.5a2 2 0 0 1 0-4H5V7.5A1.5 1.5 0 0 1 6.5 6H10V4.5z" />
          </svg>
          <span class="menu-label">插件</span>
        </button>
        <button type="button" class="menu-cell" data-menu="settings" title="打开控制中心（偏好设置）">
          <svg class="menu-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3.2" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.55V21a2 2 0 0 1-4 0v-.1A1.7 1.7 0 0 0 9 19.35a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.65 15a1.7 1.7 0 0 0-1.55-1.03H3a2 2 0 0 1 0-4h.1A1.7 1.7 0 0 0 4.65 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.65a1.7 1.7 0 0 0 1.03-1.55V3a2 2 0 0 1 4 0v.1A1.7 1.7 0 0 0 15 4.65a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.35 9v.1A1.7 1.7 0 0 0 20.9 10.1H21a2 2 0 0 1 0 4h-.1A1.7 1.7 0 0 0 19.4 15z" />
          </svg>
          <span class="menu-label">设置</span>
        </button>
        <button type="button" class="menu-cell" data-menu="snap" title="归位到默认位置">
          <svg class="menu-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="7" />
            <path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4" />
          </svg>
          <span class="menu-label">归位</span>
        </button>
        <button type="button" class="menu-cell" data-menu="hide" title="隐藏桌宠（快捷键或托盘可以叫回来）">
          <svg class="menu-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3 3l18 18" />
            <path d="M10.7 6.3A9.5 9.5 0 0 1 12 6.2c5 0 9 5.8 9 5.8a17.2 17.2 0 0 1-2.6 3.2" />
            <path d="M6.4 7.9A17.5 17.5 0 0 0 3 12s4 5.8 9 5.8a9 9 0 0 0 3.1-.5" />
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
          </svg>
          <span class="menu-label">隐藏</span>
        </button>
        <button type="button" class="menu-cell danger" data-menu="quit" title="退出 PetPC">
          <svg class="menu-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M18.4 6.6a9 9 0 1 1-12.8 0" />
            <path d="M12 2.5v9.5" />
          </svg>
          <span class="menu-label">退出</span>
        </button>
      </div>
      <div id="bubble-actions" class="bubble-actions">
        <button id="bubble-secondary" type="button"></button>
        <button id="bubble-primary" type="button" class="primary"></button>
      </div>
    </section>

    <!-- Plugin floating surface: the mount point for a plugin's own window,
         placed at the rectangles Go computed for it.

         It is the second occupant of the slot beside the pet (with the speech
         bubble), and only one of the two is ever visible. What it is NOT is a
         second window: Wails v2 has no multi-window API and the app finds its
         window by class name, so a plugin's interface has to live inside this
         one. The rectangles come from the layout - this element never derives a
         size of its own.

         The markup inside is built by src/plugin-host.js. -->
    <div id="plugin-surface" class="hidden"></div>

    <!-- The headless plugin frame: one plugin that declared `background` and was
         granted `events` runs here, permanently mounted and hidden.

         It exists because a plugin's events are delivered only to a frame the host
         has mounted, and some plugins must act while no interface is on screen - the
         todo plugin has to fire a reminder whether or not anything is open.
         Hidden rather than merely unpainted, so it can never be clicked or take
         layout space. See plugin-host.js's openBackground. -->
    <div id="plugin-background" class="hidden"></div>

    <!-- THERE IS NO PANEL ANY MORE.
         It used to be the 380x520 column beside the pet: a 待办 tab and a 对话 tab. Both
         moved out, one at a time, and the rectangle went with them.

           待办 -> the todo plugin's own floating surface (right-click -> 日程). The list is
                   that plugin's data, so the host has nothing to draw and nothing to edit.
           对话 -> the chat plugin's floating surface (the hover button, or right-click ->
                  对话). It is the plugin's own three blocks now, not a tab.

         What the panel's rectangle still buys is the WINDOW GEOMETRY: the layout keeps
         its panel rect so a plugin's floating surface has somewhere to sit beside the pet,
         and `Layout.PanelOpen` is gone with the section it described. See
         openspec/changes/todo-pomodoro-as-plugins, stage 3. -->

    <p id="toast" class="toast hidden"></p>
  </div>

  
</body>
</html>
